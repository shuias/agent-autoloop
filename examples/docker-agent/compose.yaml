# An example of running the agent inside the container, built on top of the repo's compose file.
# From the repo root:
#   COMPOSE="docker compose -f compose.yaml -f examples/docker-agent/compose.yaml"
#   $COMPOSE run --rm hub init --no-service
#   $COMPOSE run --rm --entrypoint codex hub login --device-auth
#   $COMPOSE up --build -d
services:
  hub:
    build:
      target: hub-codex
    volumes:
      # Codex refuses to start when CODEX_HOME is missing; a named volume creates it and keeps the login.
      - codex-home:/data/codex
    extra_hosts:
      # Reach a compatible API that runs on this host as http://host.docker.internal:<port>/v1.
      - "host.docker.internal:host-gateway"
volumes:
  codex-home:
